<!-- HTML template for the frontend react app: https://developer.mozilla.org/en-US/docs/Web/HTML -->
<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="referrer" content="no-referrer" />
    <title>FitWear Store Brasil - Roupas Fitness e Academia</title>
    <meta name="description" content="FitWear Store Brasil - Loja oficial de roupas fitness, treino, corrida e moda academia de alta performance." />
    <meta name="author" content="FitWear Store Brasil" />
    <meta property="og:image" content="/og-image.png" />
    <script>
      /* Detecção amigável caso o usuário abra a pasta fonte não compilada diretamente via file:// */
      (function() {
        if (window.location.protocol === 'file:') {
          window.addEventListener('DOMContentLoaded', function() {
            setTimeout(function() {
              var root = document.getElementById('root');
              if (root && (!root.children || root.children.length === 0)) {
                // Se a página estiver totalmente em branco após o carregamento
                console.warn('Abertura via file:// detectada. Se a tela estiver em branco, use a versão compilada loja-fitness-local.html gerada por npm run build:local.');
              }
            }, 2500);
          });
        }
      })();
    </script>
    <script>
      /* Anti-branding protection & sanitization */
      (function() {
        function isRadixOrPortal(element) {
          if (!element || !element.closest) return false;
          return !!(
            element.closest('#root') ||
            element.closest('[data-radix-portal]') ||
            element.closest('[data-radix-popper-content-wrapper]') ||
            element.closest('[role="dialog"]') ||
            element.closest('[role="region"]') ||
            element.closest('[role="status"]') ||
            element.closest('[data-state]') ||
            element.closest('[class*="radix"]') ||
            element.closest('ol[tabindex="-1"]')
          );
        }

        function purgeSkipElements() {
          try {
            // 1. Elementos por seletores comuns de branding
            var targets = document.querySelectorAll(
              '[id*="skip-badge"], [id*="skip-watermark"], [class*="skip-badge"], [class*="skip-watermark"], [class*="goskip"], [data-skip-badge], [data-skip-watermark], [data-skip-branding], #skip-badge, .skip-badge, .skip-watermark, a[href*="goskip.dev"], a[href*="skip.it"]'
            );
            for (var i = 0; i < targets.length; i++) {
              var el = targets[i];
              if (el && el.id !== 'root' && !isRadixOrPortal(el)) {
                el.remove();
              }
            }
            // 2. Elementos pelo texto "Criado com o Skip" ou variações fora de portais legítimos
            var allElements = document.querySelectorAll('div, a, span, button, p, section, footer, aside');
            for (var j = 0; j < allElements.length; j++) {
              var node = allElements[j];
              if (node && node.id !== 'root' && !isRadixOrPortal(node)) {
                var txt = (node.textContent || '').trim();
                if (
                  txt.indexOf('Criado com o Skip') !== -1 ||
                  txt.indexOf('Criado com Skip') !== -1 ||
                  txt.indexOf('goskip.dev') !== -1 ||
                  txt === 'Skip' ||
                  (txt.indexOf('Criado com o') !== -1 && txt.indexOf('Skip') !== -1)
                ) {
                  node.remove();
                }
              }
            }
          } catch(e) {}
        }

        purgeSkipElements();
        if (typeof MutationObserver !== 'undefined') {
          var initialObserver = new MutationObserver(function() {
            purgeSkipElements();
          });
          initialObserver.observe(document.documentElement, { childList: true, subtree: true });
        }
      })();
    </script>
  </head>

  <body>
    <div id="root"></div>
    <!-- @skip-protected: Do not remove. Required for app features. -->
    <script src="https://goskip.dev/skip.js"></script>
    <!-- @skip-protected: Do not remove. App entrypoint. -->
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
